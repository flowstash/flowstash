[project]
name = "flowstash-core"
version = "0.6.0"
description = "A managed integration framework core."
authors = [
    {name = "juraj.bezdek@gmail.com", email = "juraj.bezdek@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.110.0",
  "firebase-admin>=7.2.0,<8.0.0",
  "flowstash>=0.2.9",
  "flowstash-cli>=0.2.9",
  "flowstash-clients>=0.2.9",
  "flowstash-lib>=0.2.9",
  "flowstash-runtime>=0.2.9",
  "google-cloud-build>=3.23.0",
  "google-cloud-firestore>=2.16.0",
  "google-cloud-run>=0.10.0",
  "google-cloud-scheduler>=2.13.0",
  "google-cloud-storage>=2.14.0",
  "google-cloud-tasks>=2.16.0",
  "httpx>=0.27.0",
  "PyJWT>=2.8.0",
  "pydantic>=2.12.5,<3.0.0",
  "pytest>=8.1.1",
  "pytest-asyncio>=0.23.6",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "redis>=5.0.3",
  "respx>=0.21.1",
  "uvicorn>=0.29.0",
  "unidecode (>=1.4.0,<2.0.0)",
  "google-cloud-bigquery (>=3.40.1,<4.0.0)",
  "google-cloud-pubsub (>=2.36.0,<3.0.0)",
  "python-multipart (>=0.0.22,<0.0.23)",
  "cachetools (>=7.0.5,<8.0.0)",
]

[project.urls]
Homepage = "https://github.com/flowstash/flowstash"
Repository = "https://github.com/flowstash/flowstash"

[tool.uv]
workspace = { members = ["packages/*"] }

[tool.uv.sources]
flowstash-clients = { workspace = true }
flowstash-lib = { workspace = true }
flowstash-runtime = { workspace = true }
flowstash-cli = { workspace = true }
flowstash = { workspace = true }

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
flowstash-clients = { path = "packages/flowstash_clients", develop = true }
flowstash-lib = { path = "packages/flowstash_lib", develop = true }
flowstash-runtime = { path = "packages/flowstash_runtime", develop = true }
flowstash-cli = { path = "packages/flowstash-cli", develop = true }
flowstash = { path = "packages/flowstash", develop = true }

[tool.pytest.ini_options]

addopts = "-v -s"
testpaths = ["demo/tests"]
python_files = "test_*.py"
