[project]
name = "flowstash-lib"
version = "0.10.0"
description = "Shared domain logic and utilities for the flowstash managed platform."
authors = [{name = "juraj.bezdek@gmail.com", email = "juraj.bezdek@gmail.com"}]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "flowstash-clients>=0.10.0,<0.11.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.10.0",
    "redis>=5.0.3",
    "opentelemetry-api>=1.24.0",
    "python-dotenv>=1.0.1"
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "flowstash", from = "src" }
]

[tool.poetry.dependencies]
flowstash-clients = { path = "../flowstash_clients", develop = true }
