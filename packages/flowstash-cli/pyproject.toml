[project]
name = "flowstash-cli"
version = "0.6.0"
description = "CLI for the flowstash Managed Platform"
authors = [{name = "juraj.bezdek@gmail.com", email = "juraj.bezdek@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "flowstash-runtime>=0.6.0,<0.7.0",
    "typer[all]>=0.12.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "keyring>=25.0.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "questionary>=2.0.1",
    "websockets>=12.0",
    "libcst>=1.1.0",
]

[project.scripts]
flowstash = "flowstash.cli.main:app"

[tool.poetry]
packages = [
    { include = "flowstash", from = "src" }
]

[tool.poetry.dependencies]
flowstash-runtime = { path = "../flowstash_runtime", develop = true }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
